spring:
  application:
    name: order-query-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55434/order_query}
    username: ${DB_USER:zeroshift}
    password: ${DB_PASSWORD:zeroshift_local}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      properties:
        # A crashed consumer is noticed after 10 s instead of Kafka's default 45 s, so the group
        # rebalances (and redelivers its uncommitted records) quickly enough to watch.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: record
zeroshift:
  # No outbox connector reads this database: a replication slot would retain WAL forever.
  outbox-slot: false
server:
  port: ${PORT:18086}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
