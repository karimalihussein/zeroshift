spring:
  application:
    name: shipping-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55434/shipping}
    username: ${DB_USER:zeroshift}
    password: ${DB_PASSWORD:zeroshift_local}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
    listener:
      ack-mode: record
server:
  port: ${PORT:18085}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
