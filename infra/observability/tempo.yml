# Single-binary Tempo on local disk. The metrics generator turns spans into a service graph
# (who calls whom, through Kafka too) and span metrics, remote-written into Prometheus.
stream_over_http_enabled: true
server: {http_listen_port: 3200}
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}
# Cut blocks every few minutes instead of every 30: less trace data held in memory at once.
ingester:
  max_block_duration: 5m
compactor:
  compaction: {block_retention: 48h}
metrics_generator:
  registry:
    external_labels: {source: tempo}
  storage:
    path: /var/tempo/generator/wal
    remote_write: [{url: 'http://prometheus:9090/api/v1/write', send_exemplars: true}]
  traces_storage: {path: /var/tempo/generator/traces}
  processor:
    service_graphs:
      # A Kafka hop can take seconds (a paused connector, a retry backoff): wait for both sides.
      wait: 30s
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
