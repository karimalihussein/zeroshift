global:
  scrape_interval: 5s
  evaluation_interval: 5s
# Micrometer's /actuator/prometheus on every JVM. The service label names the replica as the
# dashboard shows it; both order-service replicas share job="order-service".
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - {targets: ['order-service:8080'], labels: {service: order-service}}
      - {targets: ['order-service-b:8080'], labels: {service: order-service-b}}
  - job_name: participants
    metrics_path: /actuator/prometheus
    static_configs:
      - {targets: ['payment-service:8080'], labels: {service: payment-service}}
      - {targets: ['inventory-service:8080'], labels: {service: inventory-service}}
      - {targets: ['shipping-service:8080'], labels: {service: shipping-service}}
      - {targets: ['order-query-service:8080'], labels: {service: order-query-service}}
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - {targets: ['app:8080'], labels: {service: migration-lab}}
