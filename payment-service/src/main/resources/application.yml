spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55434/payments}
    username: ${DB_USER:zeroshift}
    password: ${DB_PASSWORD:zeroshift_local}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      properties:
        # A crashed consumer is noticed after 10 s instead of Kafka's default 45 s, so the group
        # rebalances (and redelivers its uncommitted records) quickly enough to watch.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      ack-mode: record
server:
  port: ${PORT:18082}
payment:
  gateway-url: ${GATEWAY_URL:http://localhost:18090}
  gateway-timeout: 1500ms
  limit: 1000.00
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
