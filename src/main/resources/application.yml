spring:
  application:
    name: zeroshift
  datasource:
    url: ${TARGET_URL:jdbc:postgresql://localhost:55433/zeroshift}
    username: ${POSTGRES_USER:zeroshift}
    password: ${POSTGRES_PASSWORD:zeroshift_local}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  flyway:
    # Control-plane schema only (db/migration). Databases created before Flyway get a version-0
    # baseline so the idempotent V1+ scripts still run and record their history.
    baseline-on-migrate: true
    baseline-version: 0
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    serialization:
      indent-output: false
server:
  port: ${PORT:8080}
  address: 0.0.0.0
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
lab:
  source-url: ${SOURCE_URL:jdbc:sqlserver://localhost:1434;databaseName=zeroshift_java;encrypt=true;trustServerCertificate=true}
  source-user: sa
  source-password: ${MSSQL_SA_PASSWORD:ZeroShift!Local2026}
  batch-size: ${BATCH_SIZE:500}
  seed-rows: ${SEED_ROWS:10000}
  tick-ms: ${TICK_MS:250}
  traffic-ms: ${TRAFFIC_MS:100}
