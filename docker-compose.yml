name: zeroshift-java
# Shared by the event-driven services. restart: a simulated crash (JVM halt) is followed by a real
# restart, so recovery - rejoining the group, redelivery, duplicate suppression - can be watched.
x-commerce-service: &commerce-service
  restart: unless-stopped
  mem_limit: 640m
  depends_on:
    kafka-init: {condition: service_completed_successfully}
    commerce-postgres: {condition: service_healthy}
  healthcheck:
    test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 40s
x-commerce-env: &commerce-env
  PORT: 8080
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: ${POSTGRES_USER:-zeroshift}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
  # OpenTelemetry agent (baked into the image): HTTP, JDBC and Kafka spans, W3C context carried
  # through Kafka headers, and logs with their trace id, sent to the collector. The service name
  # comes from spring.application.name; metrics stay with Micrometer, which Prometheus scrapes.
  JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: otlp
  # Polling loops (the saga-timeout scanner) would each start a trace every second.
  OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: 'false'
# Phase 2 Kafka lab (profile kafka-lab): a separate 3-node KRaft cluster, each node both broker and
# controller, so the controller quorum is 3 voters. restart: 'no' because the lab kills, stops and
# pauses these nodes for real, and a killed broker must stay down until the operator recovers it.
# Small heaps and faster failure detection than the defaults; everything else is stock Kafka.
x-kafka-lab-node: &kafka-lab-node
  image: apache/kafka:4.1.0
  profiles: [kafka-lab]
  restart: 'no'
  mem_limit: 640m
  healthcheck:
    test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 20s
x-kafka-lab-env: &kafka-lab-env
  CLUSTER_ID: zslab-3node-kraft-00001
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-lab-1:9093,2@kafka-lab-2:9093,3@kafka-lab-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # A crashed broker is noticed after 6 s (default 9 s); a follower that stops fetching leaves the
  # ISR after 10 s (default 30 s); leadership drifts back to preferred replicas every 30 s.
  KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 1000
  KAFKA_BROKER_SESSION_TIMEOUT_MS: 6000
  KAFKA_REPLICA_LAG_TIME_MAX_MS: 10000
  KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 30
  # Lab-sized internals. Kafka preallocates a 10 MB offset and time index for every partition's
  # active segment; with the default 50 partitions each for __consumer_offsets and
  # __transaction_state each node's layer reports about 2.4 GB (sparse files, little real disk).
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 3
  KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
  KAFKA_LOG_SEGMENT_BYTES: 16777216
  KAFKA_HEAP_OPTS: -Xms192m -Xmx320m
services:
  kafka-lab-1:
    <<: *kafka-lab-node
    hostname: kafka-lab-1
    labels: {zeroshift.kafka-lab.node: '1', zeroshift.kafka-lab.cluster: compose}
    environment: {<<: *kafka-lab-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-lab-1:9092'}
  kafka-lab-2:
    <<: *kafka-lab-node
    hostname: kafka-lab-2
    labels: {zeroshift.kafka-lab.node: '2', zeroshift.kafka-lab.cluster: compose}
    environment: {<<: *kafka-lab-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-lab-2:9092'}
  kafka-lab-3:
    <<: *kafka-lab-node
    hostname: kafka-lab-3
    labels: {zeroshift.kafka-lab.node: '3', zeroshift.kafka-lab.cluster: compose}
    environment: {<<: *kafka-lab-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-lab-3:9092'}
  # The control plane kills and restarts lab brokers through Docker's API. It gets this proxy
  # instead of the socket: container endpoints only, and the control plane itself only touches
  # containers labelled zeroshift.kafka-lab.node.
  kafka-lab-docker:
    image: tecnativa/docker-socket-proxy:v0.4.1
    profiles: [kafka-lab]
    restart: 'no'
    mem_limit: 64m
    environment: {CONTAINERS: 1, POST: 1}
    volumes: ['/var/run/docker.sock:/var/run/docker.sock:ro']
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ZeroShift!Local2026}
    ports: ['127.0.0.1:${JAVA_MSSQL_PORT:-1434}:1433']
    volumes: [sqlserver-java-data:/var/opt/mssql]
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zeroshift
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
    ports: ['127.0.0.1:${JAVA_POSTGRES_PORT:-55433}:5432']
    volumes: [postgres-java-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d zeroshift']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: {context: ., args: {MODULE: migration-lab}}
    environment:
      SOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=zeroshift_java;encrypt=true;trustServerCertificate=true
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ZeroShift!Local2026}
      TARGET_URL: jdbc:postgresql://postgres:5432/zeroshift
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      SEED_ROWS: ${SEED_ROWS:-10000}
      TICK_MS: ${TICK_MS:-250}
      TRAFFIC_MS: ${TRAFFIC_MS:-100}
      EVENT_LAB_KAFKA: kafka:9092
      EVENT_LAB_CONNECT: http://kafka-connect:8083
      # Only reachable when the kafka-lab profile runs; the Kafka lab says so otherwise.
      KAFKA_LAB_BOOTSTRAP: kafka-lab-1:9092,kafka-lab-2:9092,kafka-lab-3:9092
      KAFKA_LAB_DOCKER: http://kafka-lab-docker:2375
      ORDER_SERVICE_URL: http://order-service:8080
      ORDER_SERVICE_B_URL: http://order-service-b:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      SHIPPING_SERVICE_URL: http://shipping-service:8080
      ORDER_QUERY_SERVICE_URL: http://order-query-service:8080
      RACE_LAB_GRAFANA: ${RACE_LAB_GRAFANA:-http://localhost:3000}
      # Phase 5 failure lab: only reachable when the failure-lab profile runs; the lab says so otherwise.
      FAILURE_LAB_POSTGRES: jdbc:postgresql://failure-postgres:5432/failure_lab
      FAILURE_LAB_SECURE_KAFKA: kafka-secure:9092
      SECURE_KAFKA_ADMIN_PASSWORD: ${SECURE_KAFKA_ADMIN_PASSWORD:-admin-local}
      SECURE_KAFKA_PAYMENTS_PASSWORD: ${SECURE_KAFKA_PAYMENTS_PASSWORD:-payments-local}
      SECURE_KAFKA_FULFILMENT_PASSWORD: ${SECURE_KAFKA_FULFILMENT_PASSWORD:-fulfilment-local}
      SECURE_KAFKA_CHECKOUT_PASSWORD: ${SECURE_KAFKA_CHECKOUT_PASSWORD:-checkout-local}
      # OpenTelemetry agent for the race lab's spans only: a run, each request's transaction and
      # each statement with its lock waits, exported to the collector (Tempo). Every automatic
      # instrumentation stays off, so the migration lab's polling never floods Tempo with traces.
      JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
      OTEL_SERVICE_NAME: zeroshift-control-plane
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: 'false'
      OTEL_INSTRUMENTATION_OPENTELEMETRY_API_ENABLED: 'true'
    ports: ['127.0.0.1:${JAVA_APP_PORT:-8080}:8080']
    depends_on:
      sqlserver: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  # ---- Event-driven commerce lab -------------------------------------------------------------
  # Logical WAL lets Debezium read committed outbox inserts; one database per service.
  commerce-postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=10', '-c', 'max_wal_senders=10']
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
    ports: ['127.0.0.1:${COMMERCE_POSTGRES_PORT:-55434}:5432']
    volumes:
      - commerce-postgres-data:/var/lib/postgresql/data
      - ./infra/commerce-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d commerce']
      interval: 5s
      timeout: 5s
      retries: 20
  # Single KRaft broker: partitions, offsets and consumer groups behave as in a cluster, minus
  # replication, which a one-laptop lab cannot demonstrate honestly anyway.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: n-G4dNhcRPO6SqI5n0Av6A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ['127.0.0.1:${KAFKA_PORT:-9094}:9094']
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
  kafka-init:
    image: apache/kafka:4.1.0
    entrypoint: ['sh', '/infra/topics.sh']
    volumes: ['./infra/kafka:/infra:ro']
    depends_on:
      kafka: {condition: service_healthy}
    restart: 'no'
  kafka-connect:
    image: quay.io/debezium/connect:3.3
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: zeroshift-connect
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Outbox payloads are already JSON: pass keys and values through as strings.
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ['127.0.0.1:${CONNECT_PORT:-18083}:8083']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      commerce-postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  order-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: order-service}}
    image: zeroshift/order-service:dev
    environment:
      <<: *commerce-env
      DB_URL: jdbc:postgresql://commerce-postgres:5432/orders
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-30s}
      ZEROSHIFT_INSTANCE: order-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=order-service
      # Prices come from inventory-service's catalog at order time (snapshotted on the order).
      COMMERCE_CATALOG_URL: http://inventory-service:8080
      # Seeds customers and vouchers into an empty database (this replica only: one seeder).
      COMMERCE_DEMO_DATA: 'true'
    ports: ['127.0.0.1:${ORDER_SERVICE_PORT:-18081}:8080']
  # A second replica: the order-saga consumer group spreads its partitions over both, and the
  # saga-timeout scanner runs on whichever replica holds the lease.
  order-service-b:
    <<: *commerce-service
    image: zeroshift/order-service:dev
    environment:
      <<: *commerce-env
      DB_URL: jdbc:postgresql://commerce-postgres:5432/orders
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-30s}
      ZEROSHIFT_INSTANCE: order-service-b
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=order-service-b
      COMMERCE_CATALOG_URL: http://inventory-service:8080
    depends_on:
      order-service: {condition: service_healthy}
    ports: ['127.0.0.1:${ORDER_SERVICE_B_PORT:-18088}:8080']
  payment-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: payment-service}}
    image: zeroshift/payment-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: payment-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=payment-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/payments
      GATEWAY_URL: http://payment-gateway:8080
    ports: ['127.0.0.1:${PAYMENT_SERVICE_PORT:-18082}:8080']
  inventory-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: inventory-service}}
    image: zeroshift/inventory-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: inventory-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=inventory-service
      # Seeds the product catalog into an empty database.
      COMMERCE_DEMO_DATA: 'true'
      DB_URL: jdbc:postgresql://commerce-postgres:5432/inventory
    ports: ['127.0.0.1:${INVENTORY_SERVICE_PORT:-18084}:8080']
  shipping-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: shipping-service}}
    image: zeroshift/shipping-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: shipping-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=shipping-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/shipping
    ports: ['127.0.0.1:${SHIPPING_SERVICE_PORT:-18085}:8080']
  order-query-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: order-query-service}}
    image: zeroshift/order-query-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: order-query-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=order-query-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/order_query
    ports: ['127.0.0.1:${ORDER_QUERY_SERVICE_PORT:-18086}:8080']
  # The external card processor: WireMock, made slow, down or declining from the dashboard.
  payment-gateway:
    image: wiremock/wiremock:3.13.1
    volumes: ['./infra/payment-gateway/mappings:/home/wiremock/mappings:ro']
    ports: ['127.0.0.1:${PAYMENT_GATEWAY_PORT:-18090}:8080']
  # ---- Phase 5 failure lab (profile failure-lab) ----------------------------------------------
  # Dangerous experiments run on their own infrastructure, never on the services' databases or
  # the event lab's broker settings: an in-doubt prepared transaction holds locks (and the vacuum
  # horizon) until someone resolves it, and the disaster-recovery lab drops and restores databases.
  # max_prepared_transactions > 0 enables PREPARE TRANSACTION (PostgreSQL's default is 0).
  failure-postgres:
    image: postgres:17-alpine
    profiles: [failure-lab]
    command: ['postgres', '-c', 'max_prepared_transactions=16']
    environment:
      POSTGRES_DB: failure_lab
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
    ports: ['127.0.0.1:${FAILURE_POSTGRES_PORT:-55435}:5432']
    volumes: [failure-postgres-data:/var/lib/postgresql/data]
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d failure_lab']
      interval: 5s
      timeout: 5s
      retries: 20
  # The trust-boundary lab's protected broker: every connection authenticates (SASL/PLAIN), the
  # StandardAuthorizer denies whatever no ACL allows, and only admin is a super user. The event
  # lab's broker above stays PLAINTEXT without an authorizer: it is the lab's "before".
  # PLAIN over an unencrypted listener sends passwords in clear on the Docker network; production
  # would use SASL_SSL (or mTLS). Passwords are local demo values, like every other credential here.
  kafka-secure:
    image: apache/kafka:4.1.0
    profiles: [failure-lab]
    hostname: kafka-secure
    mem_limit: 512m
    environment:
      CLUSTER_ID: zs-secure-kraft-000000001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SECURE://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SECURE://kafka-secure:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SECURE:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SECURE
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-secure:9093
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      # One principal per service: admin (the operator and the broker itself), payments (writes
      # payment events), fulfilment (reads them), checkout (writes orders only).
      KAFKA_LISTENER_NAME_SECURE_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${SECURE_KAFKA_ADMIN_PASSWORD:-admin-local}"
        user_admin="${SECURE_KAFKA_ADMIN_PASSWORD:-admin-local}"
        user_payments="${SECURE_KAFKA_PAYMENTS_PASSWORD:-payments-local}"
        user_fulfilment="${SECURE_KAFKA_FULFILMENT_PASSWORD:-fulfilment-local}"
        user_checkout="${SECURE_KAFKA_CHECKOUT_PASSWORD:-checkout-local}";
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin" password="${SECURE_KAFKA_ADMIN_PASSWORD:-admin-local}"
        user_admin="${SECURE_KAFKA_ADMIN_PASSWORD:-admin-local}";
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes: [kafka-secure-data:/var/lib/kafka/data]
    healthcheck:
      # The broker's own port needs credentials; an open TCP port is enough to call it up.
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/9092" 2>/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
  # ---- Observability ---------------------------------------------------------------------------
  # Agents → collector → Tempo (traces) and Loki (logs); Prometheus scrapes Micrometer and receives
  # Tempo's service-graph metrics; Grafana shows all three, linked by trace id.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes: ['./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro']
    mem_limit: 200m
    depends_on: [tempo, loki]
  tempo:
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yml']
    user: '0' # writes /var/tempo on a fresh named volume, which Docker creates root-owned
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ['127.0.0.1:${TEMPO_PORT:-3200}:3200']
    # Tempo holds recent traces and its write-ahead log in memory; near a hard limit its Go GC
    # thrashes and queries time out, so leave headroom.
    mem_limit: 900m
  loki:
    image: grafana/loki:3.5.5
    volumes: [loki-data:/loki]
    ports: ['127.0.0.1:${LOKI_PORT:-3100}:3100']
    mem_limit: 400m
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver # Tempo's service graph
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    mem_limit: 400m
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      # A local lab: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/event-lab.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    depends_on: [prometheus, tempo, loki]
    mem_limit: 300m
  # Registers the outbox connectors once the services' migrations created publication and slot.
  connect-init:
    image: curlimages/curl:8.16.0
    entrypoint: ['sh', '/debezium/register.sh']
    volumes: ['./infra/debezium:/debezium:ro']
    depends_on:
      kafka-connect: {condition: service_healthy}
      order-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      shipping-service: {condition: service_healthy}
    restart: 'no'
volumes:
  sqlserver-java-data:
  postgres-java-data:
  commerce-postgres-data:
  kafka-data:
  tempo-data:
  failure-postgres-data:
  kafka-secure-data:
  loki-data:
  prometheus-data:
