name: zeroshift-java
# Shared by the event-driven services. restart: a simulated crash (JVM halt) is followed by a real
# restart, so recovery - rejoining the group, redelivery, duplicate suppression - can be watched.
x-commerce-service: &commerce-service
  restart: unless-stopped
  mem_limit: 640m
  depends_on:
    kafka-init: {condition: service_completed_successfully}
    commerce-postgres: {condition: service_healthy}
  healthcheck:
    test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 40s
x-commerce-env: &commerce-env
  PORT: 8080
  KAFKA_BOOTSTRAP: kafka:9092
  DB_USER: ${POSTGRES_USER:-zeroshift}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
  # OpenTelemetry agent (baked into the image): HTTP, JDBC and Kafka spans, W3C context carried
  # through Kafka headers, and logs with their trace id, sent to the collector. The service name
  # comes from spring.application.name; metrics stay with Micrometer, which Prometheus scrapes.
  JAVA_TOOL_OPTIONS: -javaagent:/app/opentelemetry-javaagent.jar
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: otlp
  # Polling loops (the saga-timeout scanner) would each start a trace every second.
  OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: 'false'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ZeroShift!Local2026}
    ports: ['127.0.0.1:${JAVA_MSSQL_PORT:-1434}:1433']
    volumes: [sqlserver-java-data:/var/opt/mssql]
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b || exit 1']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zeroshift
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
    ports: ['127.0.0.1:${JAVA_POSTGRES_PORT:-55433}:5432']
    volumes: [postgres-java-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d zeroshift']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: {context: ., args: {MODULE: migration-lab}}
    environment:
      SOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=zeroshift_java;encrypt=true;trustServerCertificate=true
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ZeroShift!Local2026}
      TARGET_URL: jdbc:postgresql://postgres:5432/zeroshift
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      SEED_ROWS: ${SEED_ROWS:-10000}
      TICK_MS: ${TICK_MS:-250}
      TRAFFIC_MS: ${TRAFFIC_MS:-100}
      EVENT_LAB_KAFKA: kafka:9092
      EVENT_LAB_CONNECT: http://kafka-connect:8083
      ORDER_SERVICE_URL: http://order-service:8080
      ORDER_SERVICE_B_URL: http://order-service-b:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      SHIPPING_SERVICE_URL: http://shipping-service:8080
      ORDER_QUERY_SERVICE_URL: http://order-query-service:8080
    ports: ['127.0.0.1:${JAVA_APP_PORT:-8080}:8080']
    depends_on:
      sqlserver: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/actuator/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  # ---- Event-driven commerce lab -------------------------------------------------------------
  # Logical WAL lets Debezium read committed outbox inserts; one database per service.
  commerce-postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=10', '-c', 'max_wal_senders=10']
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
    ports: ['127.0.0.1:${COMMERCE_POSTGRES_PORT:-55434}:5432']
    volumes:
      - commerce-postgres-data:/var/lib/postgresql/data
      - ./infra/commerce-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d commerce']
      interval: 5s
      timeout: 5s
      retries: 20
  # Single KRaft broker: partitions, offsets and consumer groups behave as in a cluster, minus
  # replication, which a one-laptop lab cannot demonstrate honestly anyway.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: n-G4dNhcRPO6SqI5n0Av6A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ['127.0.0.1:${KAFKA_PORT:-9094}:9094']
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
  kafka-init:
    image: apache/kafka:4.1.0
    entrypoint: ['sh', '/infra/topics.sh']
    volumes: ['./infra/kafka:/infra:ro']
    depends_on:
      kafka: {condition: service_healthy}
    restart: 'no'
  kafka-connect:
    image: quay.io/debezium/connect:3.3
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: zeroshift-connect
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Outbox payloads are already JSON: pass keys and values through as strings.
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ['127.0.0.1:${CONNECT_PORT:-18083}:8083']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      commerce-postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8083/connectors >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  order-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: order-service}}
    image: zeroshift/order-service:dev
    environment:
      <<: *commerce-env
      DB_URL: jdbc:postgresql://commerce-postgres:5432/orders
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-30s}
      ZEROSHIFT_INSTANCE: order-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=order-service
    ports: ['127.0.0.1:${ORDER_SERVICE_PORT:-18081}:8080']
  # A second replica: the order-saga consumer group spreads its partitions over both, and the
  # saga-timeout scanner runs on whichever replica holds the lease.
  order-service-b:
    <<: *commerce-service
    image: zeroshift/order-service:dev
    environment:
      <<: *commerce-env
      DB_URL: jdbc:postgresql://commerce-postgres:5432/orders
      SAGA_STEP_TIMEOUT: ${SAGA_STEP_TIMEOUT:-30s}
      ZEROSHIFT_INSTANCE: order-service-b
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=order-service-b
    depends_on:
      order-service: {condition: service_healthy}
    ports: ['127.0.0.1:${ORDER_SERVICE_B_PORT:-18088}:8080']
  payment-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: payment-service}}
    image: zeroshift/payment-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: payment-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=payment-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/payments
      GATEWAY_URL: http://payment-gateway:8080
    ports: ['127.0.0.1:${PAYMENT_SERVICE_PORT:-18082}:8080']
  inventory-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: inventory-service}}
    image: zeroshift/inventory-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: inventory-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=inventory-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/inventory
    ports: ['127.0.0.1:${INVENTORY_SERVICE_PORT:-18084}:8080']
  shipping-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: shipping-service}}
    image: zeroshift/shipping-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: shipping-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=shipping-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/shipping
    ports: ['127.0.0.1:${SHIPPING_SERVICE_PORT:-18085}:8080']
  order-query-service:
    <<: *commerce-service
    build: {context: ., args: {MODULE: order-query-service}}
    image: zeroshift/order-query-service:dev
    environment:
      <<: *commerce-env
      ZEROSHIFT_INSTANCE: order-query-service
      OTEL_RESOURCE_ATTRIBUTES: service.instance.id=order-query-service
      DB_URL: jdbc:postgresql://commerce-postgres:5432/order_query
    ports: ['127.0.0.1:${ORDER_QUERY_SERVICE_PORT:-18086}:8080']
  # The external card processor: WireMock, made slow, down or declining from the dashboard.
  payment-gateway:
    image: wiremock/wiremock:3.13.1
    volumes: ['./infra/payment-gateway/mappings:/home/wiremock/mappings:ro']
    ports: ['127.0.0.1:${PAYMENT_GATEWAY_PORT:-18090}:8080']
  # ---- Observability ---------------------------------------------------------------------------
  # Agents → collector → Tempo (traces) and Loki (logs); Prometheus scrapes Micrometer and receives
  # Tempo's service-graph metrics; Grafana shows all three, linked by trace id.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ['--config=/etc/otelcol/config.yml']
    volumes: ['./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro']
    mem_limit: 200m
    depends_on: [tempo, loki]
  tempo:
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yml']
    user: '0' # writes /var/tempo on a fresh named volume, which Docker creates root-owned
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ['127.0.0.1:${TEMPO_PORT:-3200}:3200']
    # Tempo holds recent traces and its write-ahead log in memory; near a hard limit its Go GC
    # thrashes and queries time out, so leave headroom.
    mem_limit: 900m
  loki:
    image: grafana/loki:3.5.5
    volumes: [loki-data:/loki]
    ports: ['127.0.0.1:${LOKI_PORT:-3100}:3100']
    mem_limit: 400m
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver # Tempo's service graph
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    mem_limit: 400m
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      # A local lab: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/event-lab.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    depends_on: [prometheus, tempo, loki]
    mem_limit: 300m
  # Registers the outbox connectors once the services' migrations created publication and slot.
  connect-init:
    image: curlimages/curl:8.16.0
    entrypoint: ['sh', '/debezium/register.sh']
    volumes: ['./infra/debezium:/debezium:ro']
    depends_on:
      kafka-connect: {condition: service_healthy}
      order-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      shipping-service: {condition: service_healthy}
    restart: 'no'
volumes:
  sqlserver-java-data:
  postgres-java-data:
  commerce-postgres-data:
  kafka-data:
  tempo-data:
  loki-data:
  prometheus-data:
