name: zeroshift
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ZeroShift!Local2026}
    ports: ['${MSSQL_HOST_PORT:-1433}:1433']
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./database/sqlserver:/scripts:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeroshift}
      POSTGRES_USER: ${POSTGRES_USER:-zeroshift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeroshift_local}
    ports: ['${POSTGRES_HOST_PORT:-5432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env]
    environment:
      MSSQL_HOST: sqlserver
      POSTGRES_HOST: postgres
      BACKEND_PORT: 3000
    ports: ['${BACKEND_HOST_PORT:-3000}:3000']
    depends_on:
      sqlserver: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      { context: ., dockerfile: frontend/Dockerfile, args: { VITE_API_URL: http://localhost:3000 } }
    ports: ['${FRONTEND_HOST_PORT:-5173}:80']
    depends_on:
      backend: { condition: service_healthy }
volumes:
  sqlserver-data:
  postgres-data:
