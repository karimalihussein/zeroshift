# Optional: network chaos for the resilience lab (http://localhost:8080/resilience). Adds Toxiproxy
# (about 15 MB) and routes five real connections through it, so the lab can add latency, reset
# connections, black-hole traffic (a partition) or cut a link while everything keeps running:
#
#   order-db         order-service A and B  → PostgreSQL (orders)
#   payment-db       payment-service        → PostgreSQL (payments)
#   payment-kafka    payment-service        → Kafka (a dedicated CHAOS listener, see below)
#   cdc-db           Debezium (Kafka Connect) → PostgreSQL, all four outbox connectors
#   payment-gateway  payment-service        → the card gateway (WireMock)
#
# An overlay rather than a profile: a profile can add Toxiproxy but cannot re-point other services'
# connections at it. Without this file every connection is direct and nothing else changes.
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.chaos.yml up -d
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ['-host=0.0.0.0', '-config=/config/toxiproxy.json']
    volumes: ['./infra/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro']
    ports: ['127.0.0.1:${TOXIPROXY_PORT:-8474}:8474']
    mem_limit: 64m
    healthcheck:
      test: ['CMD', '/toxiproxy-cli', 'list']
      interval: 5s
      timeout: 5s
      retries: 20
  # Kafka tells a client which host to reconnect to after bootstrap: a client that bootstrapped
  # through the proxy would be sent straight to kafka:9092 and bypass it. The CHAOS listener
  # advertises the proxy's own address, so every connection on it stays behind the proxy.
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093,CHAOS://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094},CHAOS://toxiproxy:19095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,CHAOS:PLAINTEXT
  order-service:
    environment: {DB_URL: 'jdbc:postgresql://toxiproxy:15432/orders'}
    depends_on: {toxiproxy: {condition: service_healthy}}
  order-service-b:
    environment: {DB_URL: 'jdbc:postgresql://toxiproxy:15432/orders'}
    depends_on: {toxiproxy: {condition: service_healthy}}
  payment-service:
    environment:
      DB_URL: jdbc:postgresql://toxiproxy:15433/payments
      KAFKA_BOOTSTRAP: toxiproxy:19095
      GATEWAY_URL: http://toxiproxy:18091
      # The lab's gateway levers (WireMock's admin API) stay off the proxied path.
      GATEWAY_ADMIN_URL: http://payment-gateway:8080
    depends_on: {toxiproxy: {condition: service_healthy}}
  connect-init:
    environment: {DB_HOST: toxiproxy}
    depends_on: {toxiproxy: {condition: service_healthy}}
  app:
    environment: {TOXIPROXY_URL: 'http://toxiproxy:8474'}
