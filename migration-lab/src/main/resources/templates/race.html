<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZeroShift — Race condition lab</title>
  <link rel="icon" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/style.css}">
  <link rel="stylesheet" th:href="@{/race-lab.css(v=3)}">
  <script defer th:src="@{/race-lab.js(v=3)}"></script>
</head>
<body th:attr="data-grafana=${grafanaUrl}">
<main class="shell race-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="ZeroShift home"><span class="brand-mark"><span></span><span></span><span></span></span><span><strong>ZeroShift</strong><small>Distributed systems control plane</small></span></a>
    <nav class="lab-nav" aria-label="Labs"><a href="/">Migration</a><a href="/events">Event-driven</a><a href="/race" aria-current="page">Race conditions</a><a href="/resilience">Resilience</a><a href="/history">Events over time</a><a href="/failures">Failures</a><a href="/docs">Docs</a></nav>
    <div class="topbar-status"><span id="connection" class="connection" role="status"><i></i> Connecting</span><a id="grafana-link" class="environment" target="_blank" rel="noopener" hidden>Grafana</a><span class="environment">Local lab</span></div>
  </header>

  <!-- 1. Experiment header: which race, and the rule it must keep -->
  <header id="experiment" class="xp-head" aria-label="Experiment"></header>

  <!-- 2. Controls: one sticky line next to Run -->
  <form id="controls" class="race-controls" novalidate aria-label="Experiment controls"></form>

  <!-- 3. The hero: the recorded transactions, replayed -->
  <section id="hero" class="hero" aria-label="Execution"></section>

  <!-- 4–6. Verdict, why, fix -->
  <section id="outcome" class="race-outcome" aria-label="Result and explanation"></section>

  <!-- 7. Unsafe vs safe -->
  <section id="compare" class="compare" aria-label="Compare runs"></section>

  <!-- 8. Deep technical inspector, only on request -->
  <aside id="inspector" class="race-inspector" aria-label="Event inspector" aria-hidden="true"></aside>

  <footer class="page-footer"><span>ZeroShift race condition lab</span><span>Real PostgreSQL transactions · locks from pg_blocking_pids · aborts from SQLSTATE</span></footer>
</main>
</body>
</html>
