spring:
  application:
    name: zeroshift
  datasource:
    url: ${TARGET_URL:jdbc:postgresql://localhost:55433/zeroshift}
    username: ${POSTGRES_USER:zeroshift}
    password: ${POSTGRES_PASSWORD:zeroshift_local}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  flyway:
    # Control-plane schema only (db/migration). Databases created before Flyway get a version-0
    # baseline so the idempotent V1+ scripts still run and record their history.
    baseline-on-migrate: true
    baseline-version: 0
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    serialization:
      indent-output: false
server:
  port: ${PORT:8080}
  address: 0.0.0.0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
lab:
  source-url: ${SOURCE_URL:jdbc:sqlserver://localhost:1434;databaseName=zeroshift_java;encrypt=true;trustServerCertificate=true}
  source-user: sa
  source-password: ${MSSQL_SA_PASSWORD:ZeroShift!Local2026}
  batch-size: ${BATCH_SIZE:500}
  seed-rows: ${SEED_ROWS:10000}
  tick-ms: ${TICK_MS:250}
  traffic-ms: ${TRAFFIC_MS:100}
# Control plane for the event-driven lab (/events). Defaults reach the Compose stack from the host.
event-lab:
  enabled: ${EVENT_LAB_ENABLED:true}
  kafka-bootstrap: ${EVENT_LAB_KAFKA:localhost:9094}
  connect-url: ${EVENT_LAB_CONNECT:http://localhost:18083}
  grafana-url: ${EVENT_LAB_GRAFANA:http://localhost:3000}
  services:
    order-service: ${ORDER_SERVICE_URL:http://localhost:18081}
    order-service-b: ${ORDER_SERVICE_B_URL:http://localhost:18088}
    payment-service: ${PAYMENT_SERVICE_URL:http://localhost:18082}
    inventory-service: ${INVENTORY_SERVICE_URL:http://localhost:18084}
    shipping-service: ${SHIPPING_SERVICE_URL:http://localhost:18085}
    order-query-service: ${ORDER_QUERY_SERVICE_URL:http://localhost:18086}
# Phase 2 Kafka lab (Compose profile kafka-lab): a 3-node KRaft cluster and the Docker API proxy
# used to fail its nodes. Blank from the host: the lab then reports how to start it.
kafka-lab:
  bootstrap: ${KAFKA_LAB_BOOTSTRAP:}
  docker-url: ${KAFKA_LAB_DOCKER:}
  cluster: ${KAFKA_LAB_CLUSTER:compose}
# Race condition lab (/race): its runs and scenario rows live in schema race_lab of the datasource
# above. Traces of its runs open in Grafana (Tempo).
race-lab:
  grafana-url: ${RACE_LAB_GRAFANA:http://localhost:3000}
