spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55434/orders}
    username: ${DB_USER:zeroshift}
    password: ${DB_PASSWORD:zeroshift_local}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      properties:
        # A crashed consumer is noticed after 10 s instead of Kafka's default 45 s, so the group
        # rebalances (and redelivers its uncommitted records) quickly enough to watch.
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
    listener:
      # Commit each record's offset right after it is handled: the smallest redelivery window.
      ack-mode: record
server:
  port: ${PORT:18081}
order:
  step-timeout: ${SAGA_STEP_TIMEOUT:30s}
  snapshot-every: 3
commerce:
  # One currency and one tax rate for the whole lab; both are copied onto every order.
  currency: ${COMMERCE_CURRENCY:USD}
  tax-rate: ${COMMERCE_TAX_RATE:0.0800}
  # inventory-service, asked for prices on every placement (GET /products?sku=...).
  catalog-url: ${CATALOG_URL:http://localhost:18084}
  # Seed customers and vouchers into an empty database (Compose turns it on; tests leave it off).
  # commerce.demo-seed (COMMERCE_DEMO_SEED) makes the randomized names reproducible.
  demo-data: ${COMMERCE_DEMO_DATA:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
